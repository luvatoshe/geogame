name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Find JAR
        id: find-jar
        shell: bash
        run: |
          JAR=$(find target -maxdepth 1 -name "*.jar" -not -name "*sources*" -not -name "*javadoc*" | head -n 1)
          JAR_NAME=$(basename "$JAR")
          echo "jar=$JAR_NAME" >> $GITHUB_OUTPUT
          echo "Found: $JAR_NAME"

      - name: Copy JavaFX modules
        shell: bash
        run: |
          mkdir -p target/javafx
          if [[ "${{ matrix.os }}" == "windows-latest" ]]; then
            find ~/.m2/repository/org/openjfx -name "*-win.jar" -exec cp {} target/javafx/ \;
          elif [[ "${{ matrix.os }}" == "macos-latest" ]]; then
            find ~/.m2/repository/org/openjfx -name "*-mac-aarch64.jar" -exec cp {} target/javafx/ \;
          else
            find ~/.m2/repository/org/openjfx -name "*-linux.jar" -exec cp {} target/javafx/ \;
          fi
          ls -la target/javafx/

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          jpackage --type msi --name "Geogame" --input target --main-jar ${{ steps.find-jar.outputs.jar }} --main-class com.example.geogame.Launcher --module-path target/javafx --add-modules javafx.controls,javafx.web,javafx.graphics,javafx.base,javafx.media --app-version 1.0.0 --icon src/main/resources/icon.ico --win-shortcut --win-menu --dest dist

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage --type dmg --name "Geogame" --input target --main-jar ${{ steps.find-jar.outputs.jar }} --main-class com.example.geogame.Launcher --module-path target/javafx --add-modules javafx.controls,javafx.web,javafx.graphics,javafx.base,javafx.media --app-version 1.0.0 --icon src/main/resources/icon.icns --dest dist

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot
          jpackage --type deb --name "geogame" --input target --main-jar ${{ steps.find-jar.outputs.jar }} --main-class com.example.geogame.Launcher --module-path target/javafx --add-modules javafx.controls,javafx.web,javafx.graphics,javafx.base,javafx.media --app-version 1.0.0 --icon src/main/resources/icon.png --dest dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geogame-${{ matrix.artifact }}
          path: dist/*

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false