name: Build Installers

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows
          - os: macos-latest
            artifact: macos
          - os: ubuntu-latest
            artifact: linux

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build JAR
        run: mvn clean package -DskipTests

      - name: Find JAR
        id: find-jar
        shell: bash
        run: |
          JAR=$(find target -maxdepth 1 -name "*.jar" -not -name "*sources*" -not -name "*javadoc*" | head -n 1)
          echo "jar=$JAR" >> $GITHUB_OUTPUT

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        run: |
          jpackage --type msi --name "Geogame" --input target --main-jar ${{ steps.find-jar.outputs.jar }} --main-class org.springframework.boot.loader.launch.JarLauncher --app-version 1.0.0 --win-shortcut --win-menu --dest dist

      - name: Package (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          jpackage --type dmg --name "Geogame" --input target --main-jar ${{ steps.find-jar.outputs.jar }} --main-class org.springframework.boot.loader.launch.JarLauncher --app-version 1.0.0 --dest dist

      - name: Package (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update && sudo apt-get install -y fakeroot
          jpackage --type deb --name "geogame" --input target --main-jar ${{ steps.find-jar.outputs.jar }} --main-class org.springframework.boot.loader.launch.JarLauncher --app-version 1.0.0 --dest dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: geogame-${{ matrix.artifact }}
          path: dist/*

      - name: Upload to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          draft: false
          prerelease: false